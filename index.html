<head>
<meta charset="utf-8">

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--primary:#315efb;--primary2:#1939b7;--gold:#f4b740;--green:#16845b;--red:#c93b4b;--line:#e5e9f2;--soft:#edf1f8;--shadow:0 14px 40px rgba(20,33,61,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:var(--ink);position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;background:#f4f7fb;pointer-events:none}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px 0}.role-card{min-height:190px;text-align:left;padding:24px;border-radius:22px;border:2px solid #e0e7f5;background:rgba(255,255,255,.94);box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,border-color .15s}.role-card:hover{transform:translateY(-3px);border-color:var(--primary)}.role-icon{font-size:42px;display:block;margin-bottom:14px}.role-card strong{display:block;font-size:22px;margin-bottom:8px}.role-card span:last-child{color:var(--muted);line-height:1.5}.teacher-entry{margin:0 0 18px;padding:16px 18px;border-radius:18px;background:linear-gradient(110deg,#fff4d8,#fff);border:1px solid #f1d68c;box-shadow:0 10px 26px rgba(120,84,0,.12);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.teacher-entry strong{font-size:18px}.teacher-entry .btn{background:linear-gradient(135deg,#8a5b00,#d89c19);color:#fff;box-shadow:0 6px 16px rgba(138,91,0,.22)}.teacher-entry .btn:hover{background:#744c00}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:20px 16px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:10px;box-shadow:0 3px 10px rgba(24,37,84,.14);background:#fff}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#e9edff;color:#2946c4;font-weight:700}.hero{padding:30px 24px;border-radius:24px;background:linear-gradient(135deg,#172554,#315efb);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dbe4ff;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.game-card{display:flex;flex-direction:column;min-height:280px}.game-card h2{font-size:20px;margin:12px 0 8px}.game-card p{color:var(--muted);line-height:1.5;flex:1}.ref,.badge{font-size:12px;color:#315efb;font-weight:700}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#edf1ff;margin-right:5px}.badge.green{background:#e5f6ee;color:#126345}.badge.gray{background:#eef0f4;color:#667085}.badge.red{background:#fdebed;color:#a32d3d}.btn{padding:12px 16px;border-radius:13px;background:var(--primary);color:#fff;font-weight:800}.btn:hover{background:var(--primary2)}.btn.secondary{background:#edf1f8;color:var(--ink)}.btn.gold{background:var(--gold);color:#3b2a00}.btn.danger{background:#fce8eb;color:#9d2636}.btn.success{background:#e4f6ee;color:#126345}.actions{display:flex;gap:10px;flex-wrap:wrap}.back{margin-bottom:14px}.section-title{margin:22px 0 12px}.setup{text-align:center}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.mode-card{padding:20px;border:2px solid var(--line);border-radius:18px;background:#fff;text-align:left}.mode-card.selected{border-color:var(--primary);background:#f1f4ff}.mode-card strong{display:block;font-size:18px;margin-bottom:5px}.field{margin:14px 0;text-align:left}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid #cfd6e4;border-radius:12px;outline:none;background:#fff}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #dfe6ff}.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.timer{font-weight:900;font-size:22px;color:var(--primary)}.progress{height:9px;background:#e7ebf3;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--primary);transition:width .25s}.clues{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.clue-token{padding:8px 11px;border-radius:10px;background:#fff4d8;color:#785400;border:1px solid #f3d48a;font-weight:900;letter-spacing:.5px}.puzzle{margin-top:16px}.choice{display:block;width:100%;text-align:left;padding:13px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;margin:8px 0}.choice:hover,.choice.selected{border-color:#9dafef;background:#f0f3ff}.feedback{margin-top:14px;padding:12px;border-radius:12px}.ok{background:#e6f7ef;color:#106444}.bad{background:#fce8eb;color:#9d2636}.leaderboard table,.data-table{width:100%;border-collapse:collapse}.leaderboard th,.leaderboard td,.data-table th,.data-table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}.rank{font-weight:900}.small{font-size:13px;color:var(--muted)}.center{text-align:center}.empty{padding:24px;color:var(--muted);text-align:center}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}.teacher-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.teacher-nav .btn{padding:10px 13px}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.stat{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;margin-top:5px}.editor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.puzzle-editor{border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;background:#fbfcfe}.puzzle-editor h3{margin:0}.puzzle-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.options-list{display:grid;gap:8px}.option-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.hint-box{background:#f7f8ff;border:1px dashed #aebaff;border-radius:12px;padding:12px;margin-top:12px}.notice{padding:12px 14px;border-radius:12px;background:#fff8df;color:#6d5300;border:1px solid #f0d88a;margin:12px 0}.login-card{max-width:520px;margin:40px auto}.login-card .hero-mini{font-size:42px}.checkbox-row{display:flex;gap:10px;align-items:center;margin:10px 0}.checkbox-row input{width:auto}.danger-link{color:#a32d3d;font-weight:700;background:none;padding:0}.muted-box{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:14px}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.sticky{position:sticky;top:12px;align-self:start}.hidden{display:none!important}

.bilingual-line{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;align-items:stretch}.lang-panel{padding:12px 14px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);min-width:0}.lang-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-bottom:6px}.lang-ar{direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.bilingual-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bilingual-fields .field{min-width:0}.bible-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bible-frame{width:100%;height:65vh;min-height:460px;border:1px solid var(--line);border-radius:14px;background:#fff}.bible-card h2{margin-top:0}.bible-fallback{margin-top:10px}.student-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.lang-inline{display:inline-block;margin-inline-start:8px;font-size:.88em;color:var(--muted)}
@media(max-width:700px){.bilingual-line,.bilingual-fields,.bible-grid{grid-template-columns:1fr}.bible-frame{height:55vh;min-height:360px}}

@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:620px){.grid,.dashboard-grid,.field-row,.mode-grid,.role-grid{grid-template-columns:1fr}.role-card{min-height:150px}.teacher-entry{align-items:flex-start}.hero h1{font-size:27px}.app{padding:14px 12px 30px}.data-table{font-size:13px}.data-table th:nth-child(3),.data-table td:nth-child(3){display:none}}
</style>

<body><div id="app"></div>
<script>
const DEFAULT_GAMES=[
{id:'moses',title:'Rettet Mose!',ref:'2. Mose 2–3',intro:'Mose ist in Gefahr. Löse die Rätsel, sammle die Hinweise und finde den Weg zur Rettung.',color:'🌿',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'m1',type:'text',q:'Wie heißt der Mann, den Gott am brennenden Dornbusch berief?',a:'mose',hint:'Sein Name beginnt mit M.',points:100,clue:'MO'},
{id:'m2',type:'number',q:'Wie viele Plagen werden im Buch Exodus berichtet?',a:'10',hint:'Die Zahl beginnt mit einer 1.',points:100,clue:'SE'},
{id:'m3',type:'choice',q:'Was war das Zeichen, das Gott Mose am Dornbusch zeigte?',opts:['Der Stock wurde zur Schlange.','Der Nil wurde zu Blut.','Der Himmel wurde dunkel.'],a:0,hint:'Es geschah mit Moses Stab.',points:100,clue:'RETT'},
{id:'m4',type:'number',q:'Wie viele Buchstaben hat das Wort „UNG“?',a:'3',hint:'U-N-G.',points:100,clue:'UNG'}],final:'MOSERETTUNG'},
{id:'egypt',title:'Gefahr in Ägypten',ref:'2. Mose 14',intro:'Das Volk Israel steht vor dem Meer, während die ägyptische Armee näher kommt. Nur gemeinsam findet ihr den Ausweg.',color:'🌊',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'e1',type:'number',q:'Wie viele Plagen trafen Ägypten?',a:'10',hint:'Die letzte Plage war der Tod der Erstgeborenen.',points:100,clue:'SCHILF'},
{id:'e2',type:'choice',q:'Wohin führte der Weg, als das Meer sich teilte?',opts:['Durch das Meer auf trockenem Boden.','In die Wüste Sinai direkt zurück.','Auf einen Berg.'],a:0,hint:'Der Weg ging mitten hindurch.',points:100,clue:'ME'},
{id:'e3',type:'text',q:'Wie wird das Meer in 2. Mose 14 genannt?',a:'schilfmeer',hint:'Gesucht ist ein zusammengesetztes Wort.',points:100,clue:'ER'},
{id:'e4',type:'bible',q:'Suche in 2. Mose 14,21: Was ließ Mose über das Meer wehen?',a:'ostwind',hint:'Der Vers nennt eine Himmelsrichtung und das Wort „Wind“.',points:100,clue:'OSTWIND'}],final:'SCHILFMEEROSTWIND'},
{id:'esther',title:'Esthers geheime Mission',ref:'Esther 4–7',intro:'Esther muss mutig handeln, um ihr Volk zu retten. Sammelt die Hinweise und findet das geheime Lösungswort.',color:'👑',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'s1',type:'text',q:'Wie heißt Esthers Cousin und Pflegevater?',a:'mordechai',hint:'Sein Name beginnt mit M.',points:100,clue:'MUT'},
{id:'s2',type:'choice',q:'Was bat Mordechai Esther zu tun?',opts:['Zum König zu gehen und für ihr Volk einzutreten.','Aus dem Palast zu fliehen.','Eine neue Stadt zu bauen.'],a:0,hint:'Esther musste mutig zum König gehen.',points:100,clue:'FUER'},
{id:'s3',type:'number',q:'Wie viele Tage bat Esther die Juden zu fasten?',a:'3',hint:'Es ist weniger als eine Woche.',points:100,clue:'ANDERE'},
{id:'s4',type:'text',q:'Wie heißt der König, den Esther heiratete?',a:'ahasveros',accepted:['ahasveros','xerxes'],hint:'Der Name beginnt mit A.',points:100,clue:'FÜR'}],final:'MUTFUERANDEREFÜR'}
];
const AR_TRANSLATIONS={
  moses:{title:'أنقذوا موسى!',intro:'موسى في خطر. حلّوا الألغاز واجمعوا الأدلة واعثروا على طريق النجاة.',puzzles:{
    m1:{q:'ما اسم الرجل الذي دعاه الله عند العليقة المشتعلة؟',a:'موسى',hint:'يبدأ اسمه بحرف الميم.'},
    m2:{q:'كم ضربة وردت في سفر الخروج؟',a:'10',hint:'العدد يبدأ بالرقم 1.'},
    m3:{q:'ما العلامة التي أراها الله لموسى عند العليقة؟',opts:['تحولت العصا إلى حيّة.','تحوّل النيل إلى دم.','أظلمت السماء.'],hint:'حدث ذلك لعصا موسى.'},
    m4:{q:'كم حرفًا في الكلمة الألمانية „UNG“؟',a:'3',hint:'U-N-G.'}
  }},
  egypt:{title:'الخطر في مصر',intro:'يقف شعب إسرائيل أمام البحر بينما يقترب الجيش المصري. معًا فقط يمكنكم العثور على طريق النجاة.',puzzles:{
    e1:{q:'كم ضربة أصابت مصر؟',a:'10',hint:'كانت الضربة الأخيرة موت الأبكار.'},
    e2:{q:'إلى أين قاد الطريق عندما انشق البحر؟',opts:['عبر البحر على أرض يابسة.','عاد مباشرة إلى برية سيناء.','إلى جبل.'],hint:'مرّ الطريق في وسط البحر.'},
    e3:{q:'ما اسم البحر المذكور في خروج 14؟',a:'بحر سوف',hint:'ابحثوا عن اسم البحر في الآية.'},
    e4:{q:'ابحثوا في خروج 14:21: ماذا جعل موسى يهبّ على البحر؟',a:'ريح شرقية',hint:'تذكر الآية جهة من الجهات وكلمة «ريح».'}
  }},
  esther:{title:'مهمة أستير السرية',intro:'يجب على أستير أن تتصرف بشجاعة لإنقاذ شعبها. اجمعوا الأدلة واكتشفوا كلمة الحل السرية.',puzzles:{
    s1:{q:'ما اسم ابن عم أستير ومربيها؟',a:'مردخاي',hint:'يبدأ اسمه بحرف الميم.'},
    s2:{q:'ماذا طلب مردخاي من أستير أن تفعل؟',opts:['أن تذهب إلى الملك وتتشفّع من أجل شعبها.','أن تهرب من القصر.','أن تبني مدينة جديدة.'],hint:'كان على أستير أن تذهب إلى الملك بشجاعة.'},
    s3:{q:'كم يومًا طلبت أستير من اليهود أن يصوموا؟',a:'3',hint:'أقل من أسبوع.'},
    s4:{q:'ما اسم الملك الذي تزوجته أستير؟',a:'أحشويروش',hint:'يُعرف أيضًا باسم أحشويروش.'}
  }}
};
function hydrateTranslations(list){return list.map(g=>{const tr=AR_TRANSLATIONS[g.id]||{};g.titleAr=g.titleAr||tr.title||'';g.introAr=g.introAr||tr.intro||'';g.puzzles=(g.puzzles||[]).map(p=>{const pt=tr.puzzles?.[p.id]||{};p.qAr=p.qAr||pt.q||'';p.aAr=p.aAr||pt.a||'';p.hintAr=p.hintAr||pt.hint||'';if(p.opts)p.optsAr=p.optsAr||pt.opts||p.opts.map(()=> '');if(p.items)p.itemsAr=p.itemsAr||p.items.map(()=> '');return p});return g})}
function bi(de,ar,cls=''){return `<div class="bilingual-line ${cls}"><div class="lang-panel"><span class="lang-label">Deutsch</span><div>${esc(de||'')}</div></div><div class="lang-panel lang-ar" lang="ar"><span class="lang-label">العربية</span><div>${esc(ar||'')}</div></div></div>`}
const KEY='bibleEscapeGamesV31';
const BOARD='bibleEscapeLeaderboard';
const TEACHER='bibleEscapeTeacherSession';
let state={view:'roleSelect',role:null,game:null,session:null,index:0,clues:[],score:0,start:0,timer:null,selected:null,answered:false,teacherGameId:null,testMode:false};
const app=document.getElementById('app');
const norm=s=>String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0670]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[^\p{L}\p{N}]/gu,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function loadGames(){let raw=localStorage.getItem(KEY),data;if(!raw){data=structuredClone(DEFAULT_GAMES)}else{try{data=JSON.parse(raw)}catch{data=structuredClone(DEFAULT_GAMES)}}data=hydrateTranslations(data);localStorage.setItem(KEY,JSON.stringify(data));return data}
function saveGames(g){localStorage.setItem(KEY,JSON.stringify(g))}
function games(){return loadGames()}
function saveBoard(r){let x=JSON.parse(localStorage.getItem(BOARD)||'[]');x.push(r);x=x.sort((a,b)=>b.score-a.score||a.elapsed-b.elapsed).slice(0,100);localStorage.setItem(BOARD,JSON.stringify(x))}
function board(id){return JSON.parse(localStorage.getItem(BOARD)||'[]').filter(x=>x.story===id).sort((a,b)=>b.score-a.score||a.elapsed-b.elapsed).slice(0,10)}
function fmt(sec){let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function header(label='Bibel Escape Room'){return `<div class="top"><div class="brand"><img class="brand-logo" src="background-bible.png" alt="Holy Bible"> <span>${label}</span></div><span class="pill">Sonntagsschule</span></div>`}
function isTeacher(){return localStorage.getItem(TEACHER)==='1'}
function roleSelect(){state.view='roleSelect';state.role=null;clearInterval(state.timer);app.innerHTML=`<main class="app">${header()}<section class="hero"><h1>Willkommen beim Bibel Escape Room</h1><p>Bitte wähle zuerst aus, in welcher Rolle du die App nutzen möchtest.</p></section><h2 class="section-title">Wer nutzt die App?</h2><div class="role-grid"><button class="role-card" onclick="chooseStudent()"><span class="role-icon">🧩</span><strong>Sonntagsschüler/in</strong><span>Spiele auswählen, Rätsel lösen und gemeinsam den Escape schaffen.</span></button><button class="role-card" onclick="teacherLogin()"><span class="role-icon">✨</span><strong>Diener/in</strong><span>Im Lehrerbereich anmelden, Spiele verwalten und selbst Spiele testen oder spielen.</span></button></div><div class="footer">Bibel Escape Room · Sonntagsschule</div></main>`}
function chooseStudent(){state.role='student';home()}
function home(){if(!state.role) return roleSelect();state.view='home';state.testMode=false;clearInterval(state.timer);app.innerHTML=`<main class="app">${header()}<section class="hero"><h1>Bibel Escape Room</h1><p>Entdecke biblische Geschichten, löse Rätsel, sammle Hinweise und finde gemeinsam den Weg hinaus.</p></section>${state.role==='teacher'?`<div class="teacher-entry"><div><strong>✨ Lehrerbereich</strong><div class="small">Spiele verwalten, neue Rätsel erstellen oder als Diener/in selbst mitspielen.</div></div><button class="btn" onclick="teacherDashboard()">Lehrerbereich öffnen →</button></div>`:`<div class="student-role-nav"><button class="btn secondary back" onclick="roleSelect()">← Zur Rollenwahl</button></div>`}<div class="student-tools"><button class="btn secondary" onclick="openBible('home')">📖 Bibel öffnen / افتح الكتاب المقدس</button></div><h2 class="section-title">Mission auswählen / اختر المهمة</h2><div class="grid">${games().filter(g=>g.status==='published').map(g=>`<article class="card game-card"><div style="font-size:38px">${g.color}</div><div class="ref">${esc(g.ref)}</div>${bi(g.title,g.titleAr)}${bi(g.intro,g.introAr)}<div class="small" style="margin-bottom:10px">⏱ ${g.duration||15} Min. · ${esc(g.difficulty||'Mittel')} · ${g.puzzles.length} Rätsel</div><button class="btn" onclick="startGame('${g.id}')">Mission starten / ابدأ المهمة</button></article>`).join('')}</div><div class="card leaderboard" style="margin-top:18px"><h2>🏆 Bestenliste</h2><p class="small">Die Bestenliste wird auf diesem Gerät gespeichert.</p><div class="actions"><button class="btn secondary" onclick="showAllBoards()">Bestenlisten anzeigen</button><button class="btn danger" onclick="clearBoard()">Lokale Ergebnisse löschen</button></div></div><div class="footer">Bibel Escape Room · V3.2.5 — Bibel-Challenge Pilot</div></main>`}
function render(){clearInterval(state.timer);if(state.view==='roleSelect')return roleSelect();if(state.view==='home')return home();if(state.view==='setup')return renderSessionSetup();if(state.view==='game')return renderGame();if(state.view==='final')return renderFinal();if(state.view==='teacherLogin')return teacherLogin();if(state.view==='teacherDashboard')return teacherDashboard();if(state.view==='teacherEdit')return teacherEditGame(state.teacherGameId);home()}
function startGame(id){state.testMode=false;state.game=games().find(g=>g.id===id);state.view='setup';state.session=null;state.clues=[];state.index=0;state.score=0;state.selected=null;render()}
function renderSessionSetup(){let g=state.game;app.innerHTML=`<main class="app">${header()}<button class="btn secondary back" onclick="home()">← Zur Startseite</button><section class="card setup"><div style="font-size:46px">${g.color}</div><div class="ref">${esc(g.ref)}</div>${bi(g.title,g.titleAr)}${bi(g.intro,g.introAr)}<h2>Wie möchtet ihr spielen? / كيف تريدون اللعب؟</h2><div class="mode-grid"><button id="solo" class="mode-card" onclick="selectMode('solo')"><strong>👤 Allein / بمفردك</strong><span class="small">Eine Person spielt. / يلعب شخص واحد.</span></button><button id="team" class="mode-card" onclick="selectMode('team')"><strong>👥 Als Team / كفريق</strong><span class="small">Gemeinsam Rätsel lösen. / حلّوا الألغاز معًا.</span></button></div><div class="field"><label id="nameLabel">Name</label><input id="sessionName" placeholder="Name eingeben" maxlength="40"></div><button class="btn" onclick="beginSession()">Spiel starten / ابدأوا اللعب →</button></section></main>`;selectMode('solo')}
function selectMode(m){state.session={mode:m};document.getElementById('solo')?.classList.toggle('selected',m==='solo');document.getElementById('team')?.classList.toggle('selected',m==='team');let l=document.getElementById('nameLabel'),i=document.getElementById('sessionName');if(l)l.textContent=m==='team'?'Teamname':'Name';if(i)i.placeholder=m==='team'?'Teamnamen eingeben':'Name eingeben'}
function beginSession(){let n=document.getElementById('sessionName')?.value.trim();if(!n){alert('Bitte zuerst einen Namen eingeben.');return}state.session.name=n;state.index=0;state.clues=[];state.score=0;state.start=Date.now();state.view='game';render();startTimer()}
function startTimer(){clearInterval(state.timer);state.timer=setInterval(()=>{let e=Math.floor((Date.now()-state.start)/1000);let el=document.getElementById('timer');if(el)el.textContent=fmt(e)},1000)}
function renderGame(){let g=state.game,p=g.puzzles[state.index],pct=Math.round(state.index/g.puzzles.length*100);app.innerHTML=`<main class="app">${header(g.title)}<div class="student-tools"><button class="btn secondary" onclick="openBible('game')">📖 Bibel öffnen / افتح الكتاب المقدس</button></div><div class="game-head"><div><strong>${state.session.mode==='team'?'👥 '+esc(state.session.name):'👤 '+esc(state.session.name)}</strong><div class="small">Punkte: ${state.score}</div></div><div class="timer" id="timer">${fmt(Math.floor((Date.now()-state.start)/1000))}</div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><strong>🧩 Rätsel ${state.index+1} von ${g.puzzles.length}</strong><div class="clues"><span class="small">Gesammelte Hinweise:</span>${state.clues.length?state.clues.map(c=>`<span class="clue-token">${esc(c)}</span>`).join(''):'<span class="small">Noch keine</span>'}</div></div><section class="card puzzle"><div class="small">${typeLabel(p.type)}</div>${bi(p.q,p.qAr)}${p.type==='choice'?p.opts.map((o,i)=>`<button class="choice ${state.selected===i?'selected':''}" onclick="choose(${i})">${i+1}. ${esc(o)} <span class="lang-inline" dir="rtl">${esc(p.optsAr?.[i]||'')}</span></button>`).join(''):p.type==='truefalse'?`<button class="choice ${state.selected==='true'?'selected':''}" onclick="chooseTF('true')">✅ Richtig <span class="lang-inline">/ صحيح</span></button><button class="choice ${state.selected==='false'?'selected':''}" onclick="chooseTF('false')">❌ Falsch <span class="lang-inline">/ خطأ</span></button>`:p.type==='order'?`<div id="orderList">${p.items.map((x,i)=>`<div class="choice" data-index="${i}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><strong>${i+1}.</strong> ${esc(x)}<span class="lang-inline lang-ar">${esc(p.itemsAr?.[i]||'')}</span></span><span><button class="btn secondary" style="padding:7px 9px" onclick="moveOrder(${i},-1)">↑</button> <button class="btn secondary" style="padding:7px 9px" onclick="moveOrder(${i},1)">↓</button></span></div></div>`).join('')}</div><div class="small">Bringt die Ereignisse mit ↑ und ↓ in die richtige Reihenfolge. / رتّبوا الأحداث باستخدام ↑ و↓.</div>`:`<div class="field"><input id="answer" inputmode="text" placeholder="${p.type==='bible'?'Antwort aus der Bibel eingeben / اكتب الإجابة من الكتاب المقدس':'Deine Antwort / إجابتك'}"></div>`}<div class="actions"><button class="btn" onclick="checkPuzzle()">Antwort prüfen / تحقق من الإجابة</button><button class="btn secondary" onclick="showHint()">💡 Hinweis / تلميح</button></div><div id="feedback"></div></section><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="home()">← Startseite</button><button class="btn danger" onclick="quitGame()">Mission verlassen</button></div></main>`;if(p.type==='order')setupOrder();startTimer()}
function openBible(from='home'){state.bibleReturn=from;state.view='bible';clearInterval(state.timer);app.innerHTML=`<main class="app">${header('Bibel / الكتاب المقدس')}<div class="actions back"><button class="btn secondary" onclick="closeBible()">← Zurück zum Spiel / العودة</button></div><section class="hero"><h1>Die Bibel / الكتاب المقدس</h1><p>Wählt eine Sprache und sucht die benötigte Bibelstelle. / اختاروا اللغة وابحثوا عن المقطع المطلوب.</p></section><div class="notice">Falls die Bibel-Webseite hier nicht angezeigt wird, nutzt bitte „In neuem Tab öffnen“. Bible.com kann das Einbetten in andere Webseiten technisch einschränken. / إذا لم تظهر الصفحة هنا، افتحوها في علامة تبويب جديدة.</div><div class="bible-grid"><section class="card bible-card"><h2>🇩🇪 Deutsche Bibel — SCH2000</h2><iframe class="bible-frame" title="Deutsche Bibel SCH2000" src="https://www.bible.com/de/bible/157/JHN.1.SCH2000" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="bible-fallback"><a class="btn" href="https://www.bible.com/de/bible/157/JHN.1.SCH2000" target="_blank" rel="noopener noreferrer">In neuem Tab öffnen ↗</a></div></section><section class="card bible-card"><h2 class="lang-ar">🇪🇬 الكتاب المقدس بالعربية — AVD</h2><iframe class="bible-frame" title="الكتاب المقدس العربي AVD" src="https://www.bible.com/de/bible/13/JHN.1.AVD" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="bible-fallback"><a class="btn" href="https://www.bible.com/de/bible/13/JHN.1.AVD" target="_blank" rel="noopener noreferrer">فتح في علامة تبويب جديدة ↗</a></div></section></div><p class="small">Die Bibeltexte werden von Bible.com bereitgestellt. Internetverbindung erforderlich. / نصوص الكتاب المقدس مقدمة من Bible.com وتتطلب اتصالًا بالإنترنت.</p></main>`}
function closeBible(){if(state.bibleReturn==='game'&&state.game){state.view='game';renderGame()}else{state.view='home';home()}}
function typeLabel(t){return ({truefalse:'Richtig / Falsch',order:'Reihenfolge',choice:'Multiple Choice',text:'Offene Frage',number:'Zahl',bible:'Bibel-Suche'})[t]||t}
function choose(i){state.selected=i;renderGame()}
function showHint(){let f=document.getElementById('feedback'),p=state.game.puzzles[state.index];if(f)f.innerHTML=`<div class="feedback">💡 ${bi(p.hint||'Kein Hinweis hinterlegt.',p.hintAr||'لا يوجد تلميح مسجل.') }<br><span class="small">Hinweise kosten in V3.2 noch keine Punkte. / التلميحات لا تخصم نقاطًا.</span></div>`}
function setupOrder(){}
function chooseTF(v){state.selected=v;renderGame()}
function moveOrder(i,dir){let p=state.game.puzzles[state.index],arr=[...p.items],ar=[...(p.itemsAr||[])],j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];if(ar.length===arr.length)[ar[i],ar[j]]=[ar[j],ar[i]];p.items=arr;p.itemsAr=ar;renderGame()}
function currentOrder(){return [...document.querySelectorAll('#orderList [data-index]')].map(x=>Number(x.dataset.index))}
function accepted(p,v){let values=[p.a,p.aAr,...(p.accepted||[]),...(p.acceptedAr||[])].map(norm).filter(Boolean);return values.includes(norm(v))}
function checkPuzzle(){if(state.answered)return;let p=state.game.puzzles[state.index],ok=false;if(p.type==='choice')ok=state.selected===Number(p.a);else if(p.type==='truefalse')ok=state.selected===String(p.a);else if(p.type==='order')ok=JSON.stringify(p.items)===JSON.stringify(p.correctItems||p.items);else ok=accepted(p,document.getElementById('answer')?.value);let f=document.getElementById('feedback');if(!ok){if(f)f.innerHTML='<div class="feedback bad">❌ Noch nicht. Versucht es noch einmal!</div>';return}state.answered=true;state.score+=Number(p.points||100);if(p.clue)state.clues.push(p.clue);if(f)f.innerHTML=`<div class="feedback ok">✅ Richtig! ${p.clue?`Hinweis erhalten: <strong>${esc(p.clue)}</strong>`:''}</div>`;setTimeout(()=>{state.answered=false;state.selected=null;if(state.index<state.game.puzzles.length-1){state.index++;renderGame()}else finishGame()},650)}
function finishGame(){clearInterval(state.timer);state.view='final';render()}
function renderFinal(){let g=state.game;app.innerHTML=`<main class="app">${header(g.title)}<section class="card center"><div style="font-size:50px">🔐</div>${bi('Letztes Schloss','القفل الأخير')}<p>Ihr habt alle Rätsel gelöst. Jetzt müsst ihr eure gesammelten Hinweise richtig zusammensetzen. / لقد حللتم جميع الألغاز. اجمعوا الأدلة للوصول إلى كلمة الحل.</p><div class="clues" style="justify-content:center">${state.clues.map(c=>`<span class="clue-token">${esc(c)}</span>`).join('')}</div><div class="field"><label>Finales Lösungswort / كلمة الحل النهائية</label><input id="finalAnswer" placeholder="Hinweise zusammensetzen / اجمعوا الأدلة"></div><button class="btn" onclick="checkFinal()">🔓 Flucht abschließen / إتمام الهروب</button><div id="finalFeedback"></div></section></main>`}
function checkFinal(){let v=document.getElementById('finalAnswer')?.value;let ok=norm(v)===norm(state.game.final);let f=document.getElementById('finalFeedback');if(!ok){f.innerHTML='<div class="feedback bad">❌ Das Lösungswort stimmt noch nicht. Schaut euch eure Hinweise genau an.</div>';return}let elapsed=Math.floor((Date.now()-state.start)/1000);let timeBonus=Math.max(0,300-elapsed);let total=state.score+250+timeBonus;state.score=total;if(state.testMode){app.innerHTML=`<main class="app">${header('Testmodus')}<section class="hero center"><div style="font-size:50px">🧪</div><h1>Test erfolgreich</h1><p>Das Spiel funktioniert bis zum finalen Lösungswort.</p><h2>${total} Punkte im Test</h2><p>Zeit: ${fmt(elapsed)}</p></section><div class="actions"><button class="btn" onclick="teacherEditGame('${state.game.id}')">← Zur Bearbeitung</button><button class="btn secondary" onclick="teacherDashboard()">Dashboard</button></div></main>`;return}saveBoard({story:state.game.id,storyTitle:state.game.title,name:state.session.name,mode:state.session.mode,score:total,elapsed,date:new Date().toISOString()});showResults(elapsed,total)}
function showResults(elapsed,total){let b=board(state.game.id);app.innerHTML=`<main class="app">${header()}<section class="hero center"><div style="font-size:50px">🎉</div><h1>Mission geschafft!</h1><p>${esc(state.session.name)}, ihr habt ${esc(state.game.title)} erfolgreich beendet.</p><h2>${total} Punkte</h2><p>Zeit: ${fmt(elapsed)}</p></section><section class="card leaderboard"><h2>🏆 Bestenliste</h2>${table(b)}</section><div class="actions"><button class="btn" onclick="startGame('${state.game.id}')">Nochmal spielen</button><button class="btn secondary" onclick="home()">← Zur Startseite</button></div></main>`}
function table(rows){return rows.length?`<table><thead><tr><th>#</th><th>Name/Team</th><th>Punkte</th><th>Zeit</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${r.mode==='team'?'👥 ':'👤 '}${esc(r.name)}</td><td><strong>${r.score}</strong></td><td>${fmt(r.elapsed)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Ergebnisse.</div>'}
function showAllBoards(){let html=games().filter(g=>g.status==='published').map(g=>`<section class="card leaderboard" style="margin-bottom:14px"><h2>${g.color} ${esc(g.title)}</h2>${table(board(g.id))}</section>`).join('');app.innerHTML=`<main class="app">${header()}<button class="btn secondary back" onclick="home()">← Zur Startseite</button><h1>🏆 Bestenlisten</h1>${html}</main>`}
function clearBoard(){if(confirm('Alle lokalen Ergebnisse löschen?')){localStorage.removeItem(BOARD);home()}}
function quitGame(){clearInterval(state.timer);state.session=null;home()}

function teacherLogin(){state.role='teacher';state.view='teacherLogin';state.teacherSection=null;state.playMode=null;app.innerHTML=`<main class="app">${header('Lehrerbereich')}<section class="card login-card center"><div class="hero-mini">👨‍🏫</div><h1>Lehrerbereich</h1><p class="small">Bitte melde dich mit deinem persönlichen Lehrer-Konto an. Die Konten werden vom App-Administrator in Firebase freigeschaltet.</p><div class="field"><label>E-Mail-Adresse</label><input id="tuser" type="email" autocomplete="username" placeholder="name@beispiel.de"></div><div class="field"><label>Passwort</label><input id="tpass" type="password" autocomplete="current-password" placeholder="Passwort"></div><div id="teacherAuthFeedback" role="status" aria-live="polite"></div><div class="actions" style="justify-content:center"><button id="teacherLoginButton" class="btn" onclick="teacherAuth()">Anmelden</button><button class="btn secondary" onclick="roleSelect()">← Zur Rollenwahl</button></div></section></main>`;}
window.waitForBibleFirebaseApi=async function(timeoutMs=12000){const deadline=Date.now()+timeoutMs;while(!window.bibleFirebaseReady&&Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,100))}if(!window.bibleFirebaseReady)throw new Error('Firebase-Modul konnte nicht geladen werden. Prüfe die Internetverbindung und die Firebase-Dateien im Repository.');return await window.bibleFirebaseReady};
async function teacherAuth(){const email=document.getElementById('tuser')?.value.trim(),password=document.getElementById('tpass')?.value;const feedback=document.getElementById('teacherAuthFeedback'),button=document.getElementById('teacherLoginButton');const showError=(message)=>{if(feedback){feedback.className='feedback bad';feedback.textContent=message}};if(!email||!password){showError('Bitte E-Mail-Adresse und Passwort eingeben.');return}if(button){button.disabled=true;button.textContent='Anmeldung läuft…'}try{const api=await window.waitForBibleFirebaseApi();const profile=await api.signInTeacher(email,password);localStorage.setItem(TEACHER,'1');localStorage.setItem('bibleEscapeTeacherEmail',profile.email||email);state.role='teacher';state.firebaseTeacherEmail=profile.email||email;state.teacherSection=null;state.playMode=null;teacherDashboard()}catch(error){const code=String(error?.code||'');let message=String(error?.message||'Anmeldung fehlgeschlagen.');if(code.includes('auth/invalid-credential')||code.includes('auth/invalid-login-credentials')||code.includes('auth/user-not-found')||code.includes('auth/wrong-password'))message='E-Mail oder Passwort stimmen nicht. Prüfe das Lehrer-Konto in Firebase Authentication.';else if(code.includes('auth/unauthorized-domain'))message='GitHub Pages ist in Firebase Authentication nicht freigeschaltet. Füge frofail-hlag.github.io unter Authentication → Settings → Authorized domains hinzu.';else if(code.includes('permission-denied'))message='Firestore hat den Zugriff verweigert. Bitte Firestore erstellen, die firestore.rules aus dem Repository veröffentlichen und das Lehrer-Dokument prüfen.';else if(message==='TEACHER_NOT_ALLOWED')message='Dieses Konto ist nicht freigeschaltet. Lege in Firestore ein Dokument unter teachers mit der Firebase-UID an und setze active auf true.';showError(message)}finally{if(button){button.disabled=false;button.textContent='Anmelden'}}}
function teacherLogout(){localStorage.removeItem(TEACHER);localStorage.removeItem('bibleEscapeTeacherEmail');if(window.bibleFirebaseReady)window.bibleFirebaseReady.then(api=>api.signOutTeacher()).catch(error=>console.warn('Firebase sign-out:',error));state.role=null;state.teacherSection=null;state.playMode=null;roleSelect()}
function teacherDashboard(){if(typeof window.bibleEscapeRouteTeacherDashboard==='function')return window.bibleEscapeRouteTeacherDashboard();return renderTeacherEscapeDashboard()}
roleSelect();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script><script src="challenge.js"></script><script type="module" src="firebase-service.js"></script></body></html>
