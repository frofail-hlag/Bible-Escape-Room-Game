<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bibel Escape">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Bibel Escape – Sonntagsschule</title>
  <style>
    :root{--navy:#17324d;--gold:#c49a45;--cream:#f7f3ea;--ink:#20303d;--muted:#66727d;--white:#fff;--line:#e4dfd4;--ok:#2f7d58;--bad:#a84343}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit} button{cursor:pointer}.app{max-width:920px;margin:auto;min-height:100vh}
    header{background:linear-gradient(135deg,var(--navy),#294e6b);color:#fff;padding:28px 20px 24px;border-radius:0 0 28px 28px}
    .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.78;font-weight:700}.brand{font-size:1.9rem;font-weight:800;margin:.35rem 0}.sub{opacity:.82;line-height:1.45}
    main{padding:20px}.section-title{font-size:1.25rem;font-weight:800;margin:6px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 18px rgba(23,50,77,.05)}
    .story{min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.story-icon{font-size:2.2rem}.story h3{margin:8px 0 4px}.meta{font-size:.84rem;color:var(--muted)}
    .btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750;background:#eef2f5;color:var(--navy);min-height:46px}.btn.primary{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);color:#fff}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.game-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.timer{font-size:1.5rem;font-weight:850;color:var(--navy);white-space:nowrap}
    .progress{height:8px;background:#e9e6df;border-radius:99px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:var(--gold);transition:width .25s}
    .clue{background:#fbf8f0;border:1px solid #e7ddc8;border-radius:16px;padding:16px;margin:14px 0;line-height:1.55}.answer{display:flex;gap:10px;flex-wrap:wrap}.answer input{flex:1;min-width:170px;border:1px solid #ccd3d9;border-radius:13px;padding:12px 14px;background:#fff}
    .feedback{margin-top:12px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}.hint{background:#f1f5f7;border-radius:13px;padding:12px;margin-top:12px;color:#46535e}
    .hidden{display:none}.footer{color:var(--muted);font-size:.82rem;text-align:center;padding:25px 0}.badge{display:inline-block;background:#f0eadc;color:#735c2e;border-radius:99px;padding:5px 9px;font-size:.75rem;font-weight:750}
    @media(max-width:650px){.grid{grid-template-columns:1fr}header{border-radius:0 0 22px 22px}.story{min-height:0}.game-top{flex-direction:column}.timer{align-self:flex-end}}
  </style>
</head>
<body>
<div class="app">
<header>
  <div class="eyebrow">Sonntagsschule · 9–15 Jahre</div>
  <div class="brand">✦ Bibel Escape</div>
  <div class="sub">Biblische Geschichten erleben, Hinweise finden und gemeinsam Rätsel lösen.</div>
</header>
<main>
  <section id="home">
    <div class="section-title">Wählt eure Mission</div>
    <div id="storyGrid" class="grid"></div>
  </section>
  <section id="game" class="hidden"></section>
  <div class="footer">Eigene Inhalte für die Sonntagsschule · Neue Geschichten können später ergänzt werden.</div>
</main>
</div>
<script>
const stories = [
 {id:"moses",icon:"🧺",title:"Rettet Mose!",level:"Fortgeschritten",ref:"2. Mose 1–2",minutes:12,
  intro:"Mose ist noch ein Baby. Seine Familie muss einen mutigen Weg finden, ihn zu schützen. Löst die Hinweise und findet den Schlüssel zur Rettung.",
  puzzles:[
   {q:"Die Tochter des Pharao findet das Kind im Schilf. Wie nennt sie ihn?",a:["mose"],hint:"Lies 2. Mose 2,10."},
   {q:"Wie viele Monate versteckte Moses Mutter ihn, bevor sie ihn in das Körbchen legte?",a:["3","drei"],hint:"2. Mose 2,2 gibt euch die Zahl."},
   {q:"Finaler Code: Addiert die Zahl der Monate aus Rätsel 2 und die Buchstabenanzahl des Namens aus Rätsel 1.",a:["7"],hint:"3 + die Anzahl der Buchstaben von MOSE."}
  ]},
 {id:"egypt",icon:"🏺",title:"Gefahr in Ägypten",level:"Experte",ref:"2. Mose 7–14",minutes:15,
  intro:"Das Volk Israel wartet auf Befreiung. Pharao lässt es nicht ziehen. Nur wer die Zeichen und die Geschichte richtig verbindet, kommt weiter.",
  puzzles:[
   {q:"Wie viele Plagen werden im Buch Exodus beschrieben?",a:["10","zehn"],hint:"Denkt an die klassische Abfolge der Plagen."},
   {q:"Welche Plage kam direkt vor dem Auszug: Finsternis oder Erstgeburt?",a:["erstgeburt","erstgeburt töten","die erstgeburt"],hint:"Lies 2. Mose 11–12."},
   {q:"Finaler Code: Welche Zahl steht für die Zahl der Plagen?",a:["10","zehn"],hint:"Die Antwort aus Rätsel 1 ist zugleich der Schlüssel."}
  ]},
 {id:"esther",icon:"👑",title:"Esthers geheime Mission",level:"Experte",ref:"Ester 1–10",minutes:15,
  intro:"Esther steht vor einer Entscheidung, die ihr Volk retten könnte. Sie muss klug handeln und Mut zeigen.",
  puzzles:[
   {q:"Wie heißt Esthers Cousin und Pflegevater?",a:["mordechai","mordechaj"],hint:"Lies Ester 2,5–7."},
   {q:"Was riskiert Esther, wenn sie ohne Einladung zum König geht?",a:["ihr leben","ihr leben zu verlieren","den tod","ihr leben"],hint:"Wer ohne Einladung erscheint, kann nach Ester 4,11 sterben."},
   {q:"Finaler Code: Wie viele Tage bittet Esther ihr Volk zu fasten?",a:["3","drei"],hint:"Ester 4,16."}
  ]}
];

let active=null,timer=null,seconds=0;
const grid=document.getElementById("storyGrid"), home=document.getElementById("home"), game=document.getElementById("game");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderStories(){
 grid.innerHTML=stories.map(s=>`<article class="card story"><div><div class="story-icon">${s.icon}</div><h3>${esc(s.title)}</h3><div class="meta">${esc(s.level)} · ${esc(s.ref)} · ca. ${s.minutes} Min.</div></div><button class="btn primary" data-id="${s.id}">Mission starten</button></article>`).join("");
 grid.querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.id));
}
function start(id){
 active=stories.find(s=>s.id===id); seconds=active.minutes*60; let step=0; home.classList.add("hidden"); game.classList.remove("hidden");
 function draw(){
   const p=active.puzzles[step], pct=(step/active.puzzles.length)*100;
   game.innerHTML=`<div class="card">
    <div class="game-top"><div><span class="badge">${esc(active.level)}</span><h2>${active.icon} ${esc(active.title)}</h2><div class="meta">${esc(active.ref)}</div></div><div class="timer" id="timer"></div></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <p>${step===0?esc(active.intro):"Sehr gut! Der nächste Hinweis wartet auf euch."}</p>
    <div class="clue"><strong>Rätsel ${step+1} von ${active.puzzles.length}</strong><div style="margin-top:8px">${esc(p.q)}</div></div>
    <form id="form" class="answer"><input id="ans" autocomplete="off" aria-label="Antwort" placeholder="Eure Antwort"><button class="btn primary">Prüfen</button></form>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="actions" style="margin-top:14px"><button id="hint" class="btn" type="button">💡 Hinweis</button><button id="quit" class="btn" type="button">← Mission verlassen</button></div>
    <div id="hintbox" class="hint hidden"></div>
   </div>`;
   const form=game.querySelector("#form"), ans=game.querySelector("#ans"), fb=game.querySelector("#feedback");
   form.onsubmit=e=>{e.preventDefault(); const v=ans.value.trim().toLowerCase().replace(/\s+/g," "); if(p.a.some(x=>v===x)){ if(step<active.puzzles.length-1){step++;draw()}else{finish()} }else{fb.textContent="Noch nicht. Prüft den Bibeltext und versucht es erneut.";fb.className="feedback bad"}};
   game.querySelector("#hint").onclick=()=>game.querySelector("#hintbox").classList.toggle("hidden");
   game.querySelector("#hintbox").textContent=p.hint;
   game.querySelector("#quit").onclick=()=>quit();
   tick();
   ans.focus();
 }
 function tick(){clearInterval(timer);timer=setInterval(()=>{seconds=Math.max(0,seconds-1);const t=game.querySelector("#timer");if(t)t.textContent=`${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;if(seconds===0){clearInterval(timer);const f=game.querySelector("#feedback");if(f){f.textContent="⏰ Die Zeit ist abgelaufen. Startet die Mission neu und versucht es gemeinsam noch einmal.";f.className="feedback bad"}}},1000)}
 function finish(){clearInterval(timer);game.innerHTML=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:3rem">🎉</div><h2>Mission erfüllt!</h2><p>Ihr habt <strong>${esc(active.title)}</strong> erfolgreich gelöst.</p><p class="meta">In der nächsten Version können hier Punkte, Teamname, mehrere Schwierigkeitsstufen und weitere Rätsel gespeichert werden.</p><button class="btn gold" id="again">Weitere Mission</button></div>`;game.querySelector("#again").onclick=quit}
 function quit(){clearInterval(timer);active=null;game.classList.add("hidden");home.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
}
renderStories();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
