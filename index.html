<html lang="de">
<head>
<meta charset="utf-8">

<title>Bibel Escape Room</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--primary:#315efb;--primary2:#1939b7;--gold:#f4b740;--green:#16845b;--red:#c93b4b;--line:#e5e9f2;--soft:#edf1f8;--shadow:0 14px 40px rgba(20,33,61,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:var(--ink);position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(245,248,253,.88),rgba(245,248,253,.92)),url('background-bible.png') center 55%/min(72vw,560px) auto no-repeat;pointer-events:none}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px 0}.role-card{min-height:190px;text-align:left;padding:24px;border-radius:22px;border:2px solid #e0e7f5;background:rgba(255,255,255,.94);box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,border-color .15s}.role-card:hover{transform:translateY(-3px);border-color:var(--primary)}.role-icon{font-size:42px;display:block;margin-bottom:14px}.role-card strong{display:block;font-size:22px;margin-bottom:8px}.role-card span:last-child{color:var(--muted);line-height:1.5}.teacher-entry{margin:0 0 18px;padding:16px 18px;border-radius:18px;background:linear-gradient(110deg,#fff4d8,#fff);border:1px solid #f1d68c;box-shadow:0 10px 26px rgba(120,84,0,.12);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.teacher-entry strong{font-size:18px}.teacher-entry .btn{background:linear-gradient(135deg,#8a5b00,#d89c19);color:#fff;box-shadow:0 6px 16px rgba(138,91,0,.22)}.teacher-entry .btn:hover{background:#744c00}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:20px 16px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:800;font-size:20px}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#e9edff;color:#2946c4;font-weight:700}.hero{padding:30px 24px;border-radius:24px;background:linear-gradient(135deg,#172554,#315efb);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dbe4ff;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.game-card{display:flex;flex-direction:column;min-height:280px}.game-card h2{font-size:20px;margin:12px 0 8px}.game-card p{color:var(--muted);line-height:1.5;flex:1}.ref,.badge{font-size:12px;color:#315efb;font-weight:700}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#edf1ff;margin-right:5px}.badge.green{background:#e5f6ee;color:#126345}.badge.gray{background:#eef0f4;color:#667085}.badge.red{background:#fdebed;color:#a32d3d}.btn{padding:12px 16px;border-radius:13px;background:var(--primary);color:#fff;font-weight:800}.btn:hover{background:var(--primary2)}.btn.secondary{background:#edf1f8;color:var(--ink)}.btn.gold{background:var(--gold);color:#3b2a00}.btn.danger{background:#fce8eb;color:#9d2636}.btn.success{background:#e4f6ee;color:#126345}.actions{display:flex;gap:10px;flex-wrap:wrap}.back{margin-bottom:14px}.section-title{margin:22px 0 12px}.setup{text-align:center}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.mode-card{padding:20px;border:2px solid var(--line);border-radius:18px;background:#fff;text-align:left}.mode-card.selected{border-color:var(--primary);background:#f1f4ff}.mode-card strong{display:block;font-size:18px;margin-bottom:5px}.field{margin:14px 0;text-align:left}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid #cfd6e4;border-radius:12px;outline:none;background:#fff}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #dfe6ff}.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.timer{font-weight:900;font-size:22px;color:var(--primary)}.progress{height:9px;background:#e7ebf3;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--primary);transition:width .25s}.clues{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.clue-token{padding:8px 11px;border-radius:10px;background:#fff4d8;color:#785400;border:1px solid #f3d48a;font-weight:900;letter-spacing:.5px}.puzzle{margin-top:16px}.choice{display:block;width:100%;text-align:left;padding:13px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;margin:8px 0}.choice:hover,.choice.selected{border-color:#9dafef;background:#f0f3ff}.feedback{margin-top:14px;padding:12px;border-radius:12px}.ok{background:#e6f7ef;color:#106444}.bad{background:#fce8eb;color:#9d2636}.leaderboard table,.data-table{width:100%;border-collapse:collapse}.leaderboard th,.leaderboard td,.data-table th,.data-table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}.rank{font-weight:900}.small{font-size:13px;color:var(--muted)}.center{text-align:center}.empty{padding:24px;color:var(--muted);text-align:center}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}.teacher-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.teacher-nav .btn{padding:10px 13px}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.stat{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;margin-top:5px}.editor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.puzzle-editor{border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;background:#fbfcfe}.puzzle-editor h3{margin:0}.puzzle-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.options-list{display:grid;gap:8px}.option-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.hint-box{background:#f7f8ff;border:1px dashed #aebaff;border-radius:12px;padding:12px;margin-top:12px}.notice{padding:12px 14px;border-radius:12px;background:#fff8df;color:#6d5300;border:1px solid #f0d88a;margin:12px 0}.login-card{max-width:520px;margin:40px auto}.login-card .hero-mini{font-size:42px}.checkbox-row{display:flex;gap:10px;align-items:center;margin:10px 0}.checkbox-row input{width:auto}.danger-link{color:#a32d3d;font-weight:700;background:none;padding:0}.muted-box{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:14px}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.sticky{position:sticky;top:12px;align-self:start}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:620px){.grid,.dashboard-grid,.field-row,.mode-grid,.role-grid{grid-template-columns:1fr}.role-card{min-height:150px}.teacher-entry{align-items:flex-start}.hero h1{font-size:27px}.app{padding:14px 12px 30px}.data-table{font-size:13px}.data-table th:nth-child(3),.data-table td:nth-child(3){display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const DEFAULT_GAMES=[
{id:'moses',title:'Rettet Mose!',ref:'2. Mose 2–3',intro:'Mose ist in Gefahr. Löse die Rätsel, sammle die Hinweise und finde den Weg zur Rettung.',color:'🌿',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'m1',type:'text',q:'Wie heißt der Mann, den Gott am brennenden Dornbusch berief?',a:'mose',hint:'Sein Name beginnt mit M.',points:100,clue:'MO'},
{id:'m2',type:'number',q:'Wie viele Plagen werden im Buch Exodus berichtet?',a:'10',hint:'Die Zahl beginnt mit einer 1.',points:100,clue:'SE'},
{id:'m3',type:'choice',q:'Was war das Zeichen, das Gott Mose am Dornbusch zeigte?',opts:['Der Stock wurde zur Schlange.','Der Nil wurde zu Blut.','Der Himmel wurde dunkel.'],a:0,hint:'Es geschah mit Moses Stab.',points:100,clue:'RETT'},
{id:'m4',type:'number',q:'Wie viele Buchstaben hat das Wort „UNG“?',a:'3',hint:'U-N-G.',points:100,clue:'UNG'}],final:'MOSERETTUNG'},
{id:'egypt',title:'Gefahr in Ägypten',ref:'2. Mose 14',intro:'Das Volk Israel steht vor dem Meer, während die ägyptische Armee näher kommt. Nur gemeinsam findet ihr den Ausweg.',color:'🌊',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'e1',type:'number',q:'Wie viele Plagen trafen Ägypten?',a:'10',hint:'Die letzte Plage war der Tod der Erstgeborenen.',points:100,clue:'SCHILF'},
{id:'e2',type:'choice',q:'Wohin führte der Weg, als das Meer sich teilte?',opts:['Durch das Meer auf trockenem Boden.','In die Wüste Sinai direkt zurück.','Auf einen Berg.'],a:0,hint:'Der Weg ging mitten hindurch.',points:100,clue:'ME'},
{id:'e3',type:'text',q:'Wie wird das Meer in 2. Mose 14 genannt?',a:'schilfmeer',hint:'Gesucht ist ein zusammengesetztes Wort.',points:100,clue:'ER'},
{id:'e4',type:'bible',q:'Suche in 2. Mose 14,21: Was ließ Mose über das Meer wehen?',a:'ostwind',hint:'Der Vers nennt eine Himmelsrichtung und das Wort „Wind“.',points:100,clue:'OSTWIND'}],final:'SCHILFMEEROSTWIND'},
{id:'esther',title:'Esthers geheime Mission',ref:'Esther 4–7',intro:'Esther muss mutig handeln, um ihr Volk zu retten. Sammelt die Hinweise und findet das geheime Lösungswort.',color:'👑',duration:15,difficulty:'Mittel',status:'published',puzzles:[
{id:'s1',type:'text',q:'Wie heißt Esthers Cousin und Pflegevater?',a:'mordechai',hint:'Sein Name beginnt mit M.',points:100,clue:'MUT'},
{id:'s2',type:'choice',q:'Was bat Mordechai Esther zu tun?',opts:['Zum König zu gehen und für ihr Volk einzutreten.','Aus dem Palast zu fliehen.','Eine neue Stadt zu bauen.'],a:0,hint:'Esther musste mutig zum König gehen.',points:100,clue:'FUER'},
{id:'s3',type:'number',q:'Wie viele Tage bat Esther die Juden zu fasten?',a:'3',hint:'Es ist weniger als eine Woche.',points:100,clue:'ANDERE'},
{id:'s4',type:'text',q:'Wie heißt der König, den Esther heiratete?',a:'ahasveros',accepted:['ahasveros','xerxes'],hint:'Der Name beginnt mit A.',points:100,clue:'FÜR'}],final:'MUTFUERANDEREFÜR'}
];
const KEY='bibleEscapeGamesV31';
const BOARD='bibleEscapeLeaderboard';
const TEACHER='bibleEscapeTeacherSession';
let state={view:'roleSelect',role:null,game:null,session:null,index:0,clues:[],score:0,start:0,timer:null,selected:null,answered:false,teacherGameId:null,testMode:false};
const app=document.getElementById('app');
const norm=s=>String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function loadGames(){let raw=localStorage.getItem(KEY);if(!raw){localStorage.setItem(KEY,JSON.stringify(DEFAULT_GAMES));return structuredClone(DEFAULT_GAMES)}try{return JSON.parse(raw)}catch{localStorage.setItem(KEY,JSON.stringify(DEFAULT_GAMES));return structuredClone(DEFAULT_GAMES)}}
function saveGames(g){localStorage.setItem(KEY,JSON.stringify(g))}
function games(){return loadGames()}
function saveBoard(r){let x=JSON.parse(localStorage.getItem(BOARD)||'[]');x.push(r);x=x.sort((a,b)=>b.score-a.score||a.elapsed-b.elapsed).slice(0,100);localStorage.setItem(BOARD,JSON.stringify(x))}
function board(id){return JSON.parse(localStorage.getItem(BOARD)||'[]').filter(x=>x.story===id).sort((a,b)=>b.score-a.score||a.elapsed-b.elapsed).slice(0,10)}
function fmt(sec){let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function header(label='Bibel Escape Room'){return `<div class="top"><div class="brand">📖 ${label}</div><span class="pill">Sonntagsschule</span></div>`}
function isTeacher(){return localStorage.getItem(TEACHER)==='1'}
function roleSelect(){state.view='roleSelect';state.role=null;clearInterval(state.timer);app.innerHTML=`<main class="app">${header()}<section class="hero"><h1>Willkommen beim Bibel Escape Room</h1><p>Bitte wähle zuerst aus, in welcher Rolle du die App nutzen möchtest.</p></section><h2 class="section-title">Wer nutzt die App?</h2><div class="role-grid"><button class="role-card" onclick="chooseStudent()"><span class="role-icon">🧩</span><strong>Sonntagsschüler/in</strong><span>Spiele auswählen, Rätsel lösen und gemeinsam den Escape schaffen.</span></button><button class="role-card" onclick="teacherLogin()"><span class="role-icon">✨</span><strong>Diener/in</strong><span>Im Lehrerbereich anmelden, Spiele verwalten und selbst Spiele testen oder spielen.</span></button></div><div class="footer">Bibel Escape Room · Sonntagsschule</div></main>`}
function chooseStudent(){state.role='student';home()}
function home(){if(!state.role) return roleSelect();state.view='home';state.testMode=false;clearInterval(state.timer);app.innerHTML=`<main class="app">${header()}<section class="hero"><h1>Bibel Escape Room</h1><p>Entdecke biblische Geschichten, löse Rätsel, sammle Hinweise und finde gemeinsam den Weg hinaus.</p></section>${state.role==='teacher'?`<div class="teacher-entry"><div><strong>✨ Lehrerbereich</strong><div class="small">Spiele verwalten, neue Rätsel erstellen oder als Diener/in selbst mitspielen.</div></div><button class="btn" onclick="teacherDashboard()">Lehrerbereich öffnen →</button></div>`:''}<h2 class="section-title">Mission auswählen</h2><div class="grid">${games().filter(g=>g.status==='published').map(g=>`<article class="card game-card"><div style="font-size:38px">${g.color}</div><div class="ref">${esc(g.ref)}</div><h2>${esc(g.title)}</h2><p>${esc(g.intro)}</p><div class="small" style="margin-bottom:10px">⏱ ${g.duration||15} Min. · ${esc(g.difficulty||'Mittel')} · ${g.puzzles.length} Rätsel</div><button class="btn" onclick="startGame('${g.id}')">Mission starten</button></article>`).join('')}</div><div class="card leaderboard" style="margin-top:18px"><h2>🏆 Bestenliste</h2><p class="small">Die Bestenliste wird auf diesem Gerät gespeichert.</p><div class="actions"><button class="btn secondary" onclick="showAllBoards()">Bestenlisten anzeigen</button><button class="btn danger" onclick="clearBoard()">Lokale Ergebnisse löschen</button></div></div><div class="footer">Bibel Escape Room – V3.1 / V3.2 Foundation</div></main>`}
function render(){clearInterval(state.timer);if(state.view==='roleSelect')return roleSelect();if(state.view==='home')return home();if(state.view==='setup')return renderSessionSetup();if(state.view==='game')return renderGame();if(state.view==='final')return renderFinal();if(state.view==='teacherLogin')return teacherLogin();if(state.view==='teacherDashboard')return teacherDashboard();if(state.view==='teacherEdit')return teacherEditGame(state.teacherGameId);home()}
function startGame(id){state.testMode=false;state.game=games().find(g=>g.id===id);state.view='setup';state.session=null;state.clues=[];state.index=0;state.score=0;state.selected=null;render()}
function renderSessionSetup(){let g=state.game;app.innerHTML=`<main class="app">${header()}<button class="btn secondary back" onclick="home()">← Zur Startseite</button><section class="card setup"><div style="font-size:46px">${g.color}</div><div class="ref">${esc(g.ref)}</div><h1>${esc(g.title)}</h1><p>${esc(g.intro)}</p><h2>Wie möchtet ihr spielen?</h2><div class="mode-grid"><button id="solo" class="mode-card" onclick="selectMode('solo')"><strong>👤 Allein</strong><span class="small">Eine Person spielt.</span></button><button id="team" class="mode-card" onclick="selectMode('team')"><strong>👥 Als Team</strong><span class="small">Gemeinsam Rätsel lösen.</span></button></div><div class="field"><label id="nameLabel">Name</label><input id="sessionName" placeholder="Name eingeben" maxlength="40"></div><button class="btn" onclick="beginSession()">Spiel starten →</button></section></main>`;selectMode('solo')}
function selectMode(m){state.session={mode:m};document.getElementById('solo')?.classList.toggle('selected',m==='solo');document.getElementById('team')?.classList.toggle('selected',m==='team');let l=document.getElementById('nameLabel'),i=document.getElementById('sessionName');if(l)l.textContent=m==='team'?'Teamname':'Name';if(i)i.placeholder=m==='team'?'Teamnamen eingeben':'Name eingeben'}
function beginSession(){let n=document.getElementById('sessionName')?.value.trim();if(!n){alert('Bitte zuerst einen Namen eingeben.');return}state.session.name=n;state.index=0;state.clues=[];state.score=0;state.start=Date.now();state.view='game';render();startTimer()}
function startTimer(){clearInterval(state.timer);state.timer=setInterval(()=>{let e=Math.floor((Date.now()-state.start)/1000);let el=document.getElementById('timer');if(el)el.textContent=fmt(e)},1000)}
function renderGame(){let g=state.game,p=g.puzzles[state.index],pct=Math.round(state.index/g.puzzles.length*100);app.innerHTML=`<main class="app">${header(g.title)}<div class="game-head"><div><strong>${state.session.mode==='team'?'👥 '+esc(state.session.name):'👤 '+esc(state.session.name)}</strong><div class="small">Punkte: ${state.score}</div></div><div class="timer" id="timer">${fmt(Math.floor((Date.now()-state.start)/1000))}</div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><strong>🧩 Rätsel ${state.index+1} von ${g.puzzles.length}</strong><div class="clues"><span class="small">Gesammelte Hinweise:</span>${state.clues.length?state.clues.map(c=>`<span class="clue-token">${esc(c)}</span>`).join(''):'<span class="small">Noch keine</span>'}</div></div><section class="card puzzle"><div class="small">${typeLabel(p.type)}</div><h2>${esc(p.q)}</h2>${p.type==='choice'?p.opts.map((o,i)=>`<button class="choice ${state.selected===i?'selected':''}" onclick="choose(${i})">${i+1}. ${esc(o)}</button>`).join(''):p.type==='truefalse'?`<button class="choice ${state.selected==='true'?'selected':''}" onclick="chooseTF('true')">✅ Richtig</button><button class="choice ${state.selected==='false'?'selected':''}" onclick="chooseTF('false')">❌ Falsch</button>`:p.type==='order'?`<div id="orderList">${p.items.map((x,i)=>`<div class="choice" data-index="${i}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><strong>${i+1}.</strong> ${esc(x)}</span><span><button class="btn secondary" style="padding:7px 9px" onclick="moveOrder(${i},-1)">↑</button> <button class="btn secondary" style="padding:7px 9px" onclick="moveOrder(${i},1)">↓</button></span></div></div>`).join('')}</div><div class="small">Bringt die Ereignisse mit ↑ und ↓ in die richtige Reihenfolge.</div>`:`<div class="field"><input id="answer" inputmode="text" placeholder="${p.type==='bible'?'Antwort aus der Bibel eingeben':'Deine Antwort'}"></div>`}<div class="actions"><button class="btn" onclick="checkPuzzle()">Antwort prüfen</button><button class="btn secondary" onclick="showHint()">💡 Hinweis</button></div><div id="feedback"></div></section><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="home()">← Startseite</button><button class="btn danger" onclick="quitGame()">Mission verlassen</button></div></main>`;if(p.type==='order')setupOrder();startTimer()}
function typeLabel(t){return ({truefalse:'Richtig / Falsch',order:'Reihenfolge',choice:'Multiple Choice',text:'Offene Frage',number:'Zahl',bible:'Bibel-Suche'})[t]||t}
function choose(i){state.selected=i;renderGame()}
function showHint(){let f=document.getElementById('feedback');if(f)f.innerHTML=`<div class="feedback">💡 ${esc(state.game.puzzles[state.index].hint||'Kein Hinweis hinterlegt.')}<br><span class="small">Hinweise kosten in V3.2 noch keine Punkte.</span></div>`}
function setupOrder(){}
function chooseTF(v){state.selected=v;renderGame()}
function moveOrder(i,dir){let p=state.game.puzzles[state.index];let arr=[...p.items];let j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];p.items=arr;renderGame()}
function currentOrder(){return [...document.querySelectorAll('#orderList [data-index]')].map(x=>Number(x.dataset.index))}
function accepted(p,v){let values=[p.a,...(p.accepted||[])].map(norm);return values.includes(norm(v))}
function checkPuzzle(){if(state.answered)return;let p=state.game.puzzles[state.index],ok=false;if(p.type==='choice')ok=state.selected===Number(p.a);else if(p.type==='truefalse')ok=state.selected===String(p.a);else if(p.type==='order')ok=JSON.stringify(p.items)===JSON.stringify(p.correctItems||p.items);else ok=accepted(p,document.getElementById('answer')?.value);let f=document.getElementById('feedback');if(!ok){if(f)f.innerHTML='<div class="feedback bad">❌ Noch nicht. Versucht es noch einmal!</div>';return}state.answered=true;state.score+=Number(p.points||100);if(p.clue)state.clues.push(p.clue);if(f)f.innerHTML=`<div class="feedback ok">✅ Richtig! ${p.clue?`Hinweis erhalten: <strong>${esc(p.clue)}</strong>`:''}</div>`;setTimeout(()=>{state.answered=false;state.selected=null;if(state.index<state.game.puzzles.length-1){state.index++;renderGame()}else finishGame()},650)}
function finishGame(){clearInterval(state.timer);state.view='final';render()}
function renderFinal(){let g=state.game;app.innerHTML=`<main class="app">${header(g.title)}<section class="card center"><div style="font-size:50px">🔐</div><h1>Letztes Schloss</h1><p>Ihr habt alle Rätsel gelöst. Jetzt müsst ihr eure gesammelten Hinweise richtig zusammensetzen.</p><div class="clues" style="justify-content:center">${state.clues.map(c=>`<span class="clue-token">${esc(c)}</span>`).join('')}</div><div class="field"><label>Finales Lösungswort</label><input id="finalAnswer" placeholder="Hinweise zusammensetzen"></div><button class="btn" onclick="checkFinal()">🔓 Flucht abschließen</button><div id="finalFeedback"></div></section></main>`}
function checkFinal(){let v=document.getElementById('finalAnswer')?.value;let ok=norm(v)===norm(state.game.final);let f=document.getElementById('finalFeedback');if(!ok){f.innerHTML='<div class="feedback bad">❌ Das Lösungswort stimmt noch nicht. Schaut euch eure Hinweise genau an.</div>';return}let elapsed=Math.floor((Date.now()-state.start)/1000);let timeBonus=Math.max(0,300-elapsed);let total=state.score+250+timeBonus;state.score=total;if(state.testMode){app.innerHTML=`<main class="app">${header('Testmodus')}<section class="hero center"><div style="font-size:50px">🧪</div><h1>Test erfolgreich</h1><p>Das Spiel funktioniert bis zum finalen Lösungswort.</p><h2>${total} Punkte im Test</h2><p>Zeit: ${fmt(elapsed)}</p></section><div class="actions"><button class="btn" onclick="teacherEditGame('${state.game.id}')">← Zur Bearbeitung</button><button class="btn secondary" onclick="teacherDashboard()">Dashboard</button></div></main>`;return}saveBoard({story:state.game.id,storyTitle:state.game.title,name:state.session.name,mode:state.session.mode,score:total,elapsed,date:new Date().toISOString()});showResults(elapsed,total)}
function showResults(elapsed,total){let b=board(state.game.id);app.innerHTML=`<main class="app">${header()}<section class="hero center"><div style="font-size:50px">🎉</div><h1>Mission geschafft!</h1><p>${esc(state.session.name)}, ihr habt ${esc(state.game.title)} erfolgreich beendet.</p><h2>${total} Punkte</h2><p>Zeit: ${fmt(elapsed)}</p></section><section class="card leaderboard"><h2>🏆 Bestenliste</h2>${table(b)}</section><div class="actions"><button class="btn" onclick="startGame('${state.game.id}')">Nochmal spielen</button><button class="btn secondary" onclick="home()">← Zur Startseite</button></div></main>`}
function table(rows){return rows.length?`<table><thead><tr><th>#</th><th>Name/Team</th><th>Punkte</th><th>Zeit</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${r.mode==='team'?'👥 ':'👤 '}${esc(r.name)}</td><td><strong>${r.score}</strong></td><td>${fmt(r.elapsed)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Ergebnisse.</div>'}
function showAllBoards(){let html=games().filter(g=>g.status==='published').map(g=>`<section class="card leaderboard" style="margin-bottom:14px"><h2>${g.color} ${esc(g.title)}</h2>${table(board(g.id))}</section>`).join('');app.innerHTML=`<main class="app">${header()}<button class="btn secondary back" onclick="home()">← Zur Startseite</button><h1>🏆 Bestenlisten</h1>${html}</main>`}
function clearBoard(){if(confirm('Alle lokalen Ergebnisse löschen?')){localStorage.removeItem(BOARD);home()}}
function quitGame(){clearInterval(state.timer);state.session=null;home()}

function teacherLogin(){state.role='teacher';state.view='teacherLogin';if(isTeacher()){teacherDashboard();return}app.innerHTML=`<main class="app">${header('Lehrerbereich')}<section class="card login-card center"><div class="hero-mini">👨‍🏫</div><h1>Lehrerbereich</h1><p class="small">V3.1/V3.2-Prototyp: Der Login wird momentan nur auf diesem Gerät gespeichert. Für einen echten gemeinsamen Lehrer-Login über mehrere Geräte bauen wir später die Server-Anbindung.</p><div class="field"><label>Lehrername</label><input id="tuser" value="Lehrer"></div><div class="field"><label>Passwort</label><input id="tpass" type="password" placeholder="••••"></div><div class="notice">Demo-Zugang für den Prototyp: <strong>Lehrer / 1234</strong></div><div class="actions" style="justify-content:center"><button class="btn" onclick="teacherAuth()">Anmelden</button><button class="btn secondary" onclick="roleSelect()">← Zur Rollenwahl</button></div></section></main>`}
function teacherAuth(){let u=document.getElementById('tuser')?.value.trim(),p=document.getElementById('tpass')?.value;if(u==='Lehrer'&&p==='1234'){localStorage.setItem(TEACHER,'1');teacherDashboard()}else alert('Login nicht korrekt. Für den Prototyp bitte Lehrer / 1234 verwenden.')}
function teacherLogout(){localStorage.removeItem(TEACHER);state.role=null;roleSelect()}
function teacherDashboard(){if(!isTeacher()){teacherLogin();return}let gs=games(),published=gs.filter(g=>g.status==='published').length,drafts=gs.filter(g=>g.status!=='published').length;app.innerHTML=`<main class="app">${header('Lehrerbereich')}<div class="teacher-nav"><button class="btn secondary" onclick="teacherDashboard()">📊 Dashboard</button><button class="btn secondary" onclick="teacherNewGame()">➕ Neues Spiel</button><button class="btn" onclick="state.role='teacher';home()">🎮 Spiele spielen</button><button class="btn secondary" onclick="teacherLogout()">Abmelden</button></div><section class="hero"><h1>Lehrerbereich</h1><p>Erstellt, bearbeitet und testet eure Bible Escape Games. Änderungen werden in diesem Prototyp lokal auf diesem Gerät gespeichert.</p></section><div class="dashboard-grid"><div class="stat"><span class="small">Spiele gesamt</span><strong>${gs.length}</strong></div><div class="stat"><span class="small">Veröffentlicht</span><strong>${published}</strong></div><div class="stat"><span class="small">Entwürfe</span><strong>${drafts}</strong></div></div><section class="card"><div class="editor-head"><div><h2>🎮 Meine Spiele</h2><p class="small">Die drei Startspiele können genauso bearbeitet werden wie neue Spiele.</p></div><button class="btn" onclick="teacherNewGame()">➕ Neues Spiel</button></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>Spiel</th><th>Status</th><th>Rätsel</th><th>Aktionen</th></tr></thead><tbody>${gs.map(g=>`<tr><td><strong>${g.color} ${esc(g.title)}</strong><br><span class="small">${esc(g.ref)}</span></td><td>${g.status==='published'?'<span class="badge green">Veröffentlicht</span>':'<span class="badge gray">Entwurf</span>'}</td><td>${g.puzzles.length}</td><td><div class="actions"><button class="btn secondary" onclick="teacherEditGame('${g.id}')">Bearbeiten</button><button class="btn gold" onclick="teacherPreview('${g.id}')">Testen</button><button class="btn danger" onclick="teacherDeleteGame('${g.id}')">Archivieren</button></div></td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:16px"><h2>💡 Was kommt als Nächstes?</h2><p class="small">V3.1/V3.2 enthält die Lehrer-Grundlage und die fünf Rätselarten. Eine KI-Hilfe wird bewusst noch nicht eingebaut, damit zuerst getestet werden kann, wie gut der manuelle Workflow funktioniert.</p></section></main>`}
function emptyGame(){return {id:'g_'+Date.now(),title:'Neues Bibel Escape Game',ref:'',intro:'',color:'📖',duration:20,difficulty:'Mittel',status:'draft',puzzles:[],final:''}}
function teacherNewGame(){if(!isTeacher())return teacherLogin();let g=emptyGame();saveGameAndEdit(g,true)}
function saveGameAndEdit(g,isNew=false){let gs=games();if(!gs.some(x=>x.id===g.id))gs.push(g);saveGames(gs);state.teacherGameId=g.id;teacherEditGame(g.id,isNew)}
function teacherEditGame(id){if(!isTeacher())return teacherLogin();let g=games().find(x=>x.id===id);if(!g)return teacherDashboard();state.teacherGameId=id;app.innerHTML=`<main class="app">${header('Spiel bearbeiten')}<div class="teacher-nav"><button class="btn secondary" onclick="teacherDashboard()">← Dashboard</button><button class="btn secondary" onclick="teacherPreview('${g.id}')">▶ Testen</button><button class="btn secondary" onclick="teacherNewPuzzle('${g.id}')">➕ Rätsel</button></div><div class="two-col"><section><div class="card"><div class="editor-head"><div><h1>${g.color} Spiel bearbeiten</h1><p class="small">Alle Felder können geändert werden. Das Spiel wird erst für Teilnehmer sichtbar, wenn es veröffentlicht ist.</p></div><span class="badge ${g.status==='published'?'green':'gray'}">${g.status==='published'?'Veröffentlicht':'Entwurf'}</span></div><div class="field-row"><div class="field"><label>Titel</label><input id="g_title" value="${esc(g.title)}"></div><div class="field"><label>Emoji / Symbol</label><input id="g_color" value="${esc(g.color)}"></div></div><div class="field-row"><div class="field"><label>Bibelstelle</label><input id="g_ref" value="${esc(g.ref)}"></div><div class="field"><label>Dauer (Minuten)</label><input id="g_duration" type="number" min="1" value="${g.duration||20}"></div></div><div class="field-row"><div class="field"><label>Schwierigkeit</label><select id="g_diff"><option ${g.difficulty==='Einfach'?'selected':''}>Einfach</option><option ${g.difficulty==='Mittel'?'selected':''}>Mittel</option><option ${g.difficulty==='Schwer'?'selected':''}>Schwer</option></select></div><div class="field"><label>Status</label><select id="g_status"><option value="draft" ${g.status!=='published'?'selected':''}>Entwurf</option><option value="published" ${g.status==='published'?'selected':''}>Veröffentlicht</option></select></div></div><div class="field"><label>Einleitung</label><textarea id="g_intro">${esc(g.intro)}</textarea></div><div class="field"><label>Finales Lösungswort</label><input id="g_final" value="${esc(g.final||'')}"><div class="small">Die gesammelten Hinweise werden in dieser Reihenfolge zusammengesetzt.</div></div><div class="actions"><button class="btn" onclick="saveGameMeta('${g.id}')">💾 Änderungen speichern</button><button class="btn secondary" onclick="teacherNewPuzzle('${g.id}')">➕ Rätsel hinzufügen</button></div></div><section class="card" style="margin-top:16px"><div class="editor-head"><div><h2>🧩 Rätsel (${g.puzzles.length})</h2><p class="small">Hier kannst du vorhandene Fragen ändern oder neue Rätsel hinzufügen.</p></div><button class="btn" onclick="teacherNewPuzzle('${g.id}')">➕ Rätsel hinzufügen</button></div>${g.puzzles.length?g.puzzles.map((p,i)=>puzzleEditor(g,i)).join(''):'<div class="empty">Noch keine Rätsel. Füge das erste Rätsel hinzu.</div>'}</section></section><aside class="sticky"><section class="card"><h2>🧪 Schnelltest</h2><p class="small">Teste dein Spiel jederzeit mit den aktuellen Daten.</p><button class="btn gold" style="width:100%" onclick="teacherPreview('${g.id}')">▶ Spiel testen</button></section><section class="card" style="margin-top:14px"><h2>🔐 Hinweise</h2><p class="small">Jedes erfolgreich gelöste Rätsel kann einen Hinweis vergeben. Der Hinweis kann ein Buchstabe, Wort, Zahl oder Code sein.</p><div class="muted-box"><strong>Beispiel</strong><br><span class="small">Rätsel 1 → MO<br>Rätsel 2 → SE<br>Rätsel 3 → RETTUNG</span></div></section></aside></div></main>`}
function puzzleEditor(g,i){let p=g.puzzles[i];return `<article class="puzzle-editor"><div class="puzzle-toolbar"><div><h3>Rätsel ${i+1}</h3><span class="badge">${typeLabel(p.type)}</span></div><button class="btn danger" onclick="deletePuzzle('${g.id}',${i})">Löschen</button></div><div class="field"><label>Rätseltyp</label><select onchange="changePuzzleType('${g.id}',${i},this.value)">${['truefalse','order','choice','text','number','bible'].map(t=>`<option value="${t}" ${p.type===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select></div><div class="field"><label>Frage</label><textarea id="pq_${i}">${esc(p.q||'')}</textarea></div>${p.type==='choice'?choiceFields(p,i):p.type==='truefalse'?trueFalseFields(p,i):p.type==='order'?orderFields(p,i):`<div class="field"><label>Richtige Antwort</label><input id="pa_${i}" value="${esc(p.a||'')}"><div class="small">Bei offenen Fragen kannst du unten zusätzliche akzeptierte Antworten hinterlegen.</div></div><div class="field"><label>Akzeptierte Alternativen (mit Komma trennen)</label><input id="pac_${i}" value="${esc((p.accepted||[]).join(', '))}"></div>`}<div class="field-row"><div class="field"><label>Hinweis für Teilnehmer</label><input id="ph_${i}" value="${esc(p.hint||'')}"></div><div class="field"><label>Punkte</label><input id="pp_${i}" type="number" min="0" value="${Number(p.points||100)}"></div></div><div class="field"><label>Gesammelter Hinweis</label><input id="pc_${i}" value="${esc(p.clue||'')}"><div class="small">Dieser Hinweis wird nach einer richtigen Antwort gesammelt.</div></div><div class="actions"><button class="btn" onclick="savePuzzle('${g.id}',${i})">💾 Rätsel speichern</button><button class="btn secondary" onclick="duplicatePuzzle('${g.id}',${i})">Kopieren</button></div></article>`}
function trueFalseFields(p,i){return `<div class="field"><label>Richtige Antwort</label><div class="actions"><label class="choice" style="display:flex;align-items:center;gap:8px"><input type="radio" name="tf_${i}" value="true" ${String(p.a)==='true'?'checked':''}> Richtig</label><label class="choice" style="display:flex;align-items:center;gap:8px"><input type="radio" name="tf_${i}" value="false" ${String(p.a)==='false'?'checked':''}> Falsch</label></div></div>`}
function choiceFields(p,i){return `<div class="field"><label>Antwortmöglichkeiten</label><div class="options-list">${p.opts.map((o,j)=>`<div class="option-row"><input id="po_${i}_${j}" value="${esc(o)}"><label class="checkbox-row"><input type="radio" name="correct_${i}" value="${j}" ${Number(p.a)===j?'checked':''}> richtig</label></div>`).join('')}</div><button class="btn secondary" style="margin-top:8px" onclick="addChoice('${gIdForButton(i)}',${i})">+ Antwort hinzufügen</button></div>`}
function gIdForButton(i){return state.teacherGameId}
function orderFields(p,i){return `<div class="field"><label>Ereignisse in richtiger Reihenfolge</label><textarea id="poitems_${i}">${esc((p.items||[]).join('\n'))}</textarea><div class="small">Eine Zeile pro Ereignis. Die richtige Reihenfolge entspricht der Zeilenreihenfolge.</div></div>`}
function saveGameMeta(id){let gs=games(),g=gs.find(x=>x.id===id);g.title=document.getElementById('g_title').value.trim()||'Unbenanntes Spiel';g.color=document.getElementById('g_color').value.trim()||'📖';g.ref=document.getElementById('g_ref').value.trim();g.duration=Number(document.getElementById('g_duration').value)||20;g.difficulty=document.getElementById('g_diff').value;g.status=document.getElementById('g_status').value;g.intro=document.getElementById('g_intro').value.trim();g.final=document.getElementById('g_final').value.trim();saveGames(gs);teacherEditGame(id)}
function savePuzzle(id,i){let gs=games(),g=gs.find(x=>x.id===id),p=g.puzzles[i];p.q=document.getElementById('pq_'+i).value.trim();p.hint=document.getElementById('ph_'+i).value.trim();p.points=Number(document.getElementById('pp_'+i).value)||0;p.clue=document.getElementById('pc_'+i).value.trim();if(p.type==='choice'){p.opts=p.opts.map((_,j)=>document.getElementById(`po_${i}_${j}`)?.value.trim()||'');let checked=document.querySelector(`input[name="correct_${i}"]:checked`);p.a=checked?Number(checked.value):0}else if(p.type==='truefalse'){let checked=document.querySelector(`input[name="tf_${i}"]:checked`);p.a=checked?checked.value:'true'}else if(p.type==='order'){p.items=document.getElementById('poitems_'+i).value.split('\n').map(x=>x.trim()).filter(Boolean);p.correctItems=[...p.items]}else{p.a=document.getElementById('pa_'+i).value.trim();p.accepted=document.getElementById('pac_'+i).value.split(',').map(x=>x.trim()).filter(Boolean)}saveGames(gs);teacherEditGame(id)}
function changePuzzleType(id,i,t){let gs=games(),g=gs.find(x=>x.id===id),old=g.puzzles[i],base={id:old.id||'p_'+Date.now(),type:t,q:old.q||'',hint:old.hint||'',points:old.points||100,clue:old.clue||''};if(t==='choice')Object.assign(base,{opts:['Antwort A','Antwort B','Antwort C'],a:0});else if(t==='truefalse')Object.assign(base,{a:'true'});else if(t==='order')Object.assign(base,{items:['Ereignis 1','Ereignis 2','Ereignis 3'],correctItems:['Ereignis 1','Ereignis 2','Ereignis 3']});else Object.assign(base,{a:old.a||'',accepted:old.accepted||[]});g.puzzles[i]=base;saveGames(gs);teacherEditGame(id)}
function addChoice(id,i){let gs=games(),g=gs.find(x=>x.id===id);g.puzzles[i].opts.push('Neue Antwort');saveGames(gs);teacherEditGame(id)}
function teacherNewPuzzle(id){let gs=games(),g=gs.find(x=>x.id===id);g.puzzles.push({id:'p_'+Date.now(),type:'choice',q:'Neue Frage',opts:['Antwort A','Antwort B','Antwort C'],a:0,hint:'',points:100,clue:''});saveGames(gs);teacherEditGame(id)}
function deletePuzzle(id,i){if(!confirm('Dieses Rätsel wirklich löschen?'))return;let gs=games(),g=gs.find(x=>x.id===id);g.puzzles.splice(i,1);saveGames(gs);teacherEditGame(id)}
function duplicatePuzzle(id,i){let gs=games(),g=gs.find(x=>x.id===id),copy=structuredClone(g.puzzles[i]);copy.id='p_'+Date.now();g.puzzles.splice(i+1,0,copy);saveGames(gs);teacherEditGame(id)}
function teacherDeleteGame(id){let gs=games(),g=gs.find(x=>x.id===id);if(!g)return;if(!confirm(`„${g.title}“ archivieren? Das Spiel verschwindet aus dem Teilnehmerbereich.`))return;g.status='archived';saveGames(gs);teacherDashboard()}
function teacherPreview(id){let g=games().find(x=>x.id===id);if(!g)return;state.testMode=true;state.game=structuredClone(g);state.session={mode:'team',name:'TEST – Lehrerbereich'};state.clues=[];state.index=0;state.score=0;state.start=Date.now();state.view='game';render();startTimer()}
roleSelect();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
