name: Bible Challenge security checks

on:
  push:
    branches: [secure-bible-challenge-answers]
    paths:
      - "challenge.js"
      - "firebase-service.js"
      - "firestore.rules"
      - "firestore.rules.test.js"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/bible-challenge-security-checks.yml"
  pull_request:
    paths:
      - "challenge.js"
      - "firebase-service.js"
      - "firestore.rules"
      - "firestore.rules.test.js"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/bible-challenge-security-checks.yml"

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check challenge script syntax
        run: node --check challenge.js
      - name: Check Firebase service module syntax
        run: node --check firebase-service.js
      - name: Run Firestore rules emulator tests
        run: npx firebase emulators:exec --only firestore --project demo-biblireise-security "npm run test:rules"
